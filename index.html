<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keuangan Pribadi</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root {
      --bg: #effbe9;
      --mu: #9fc7a9;
      --te: #0f2c16;
      --ac: #2b7a3e;
      --card: #ffffff;
      --border: #c8e6c9;
      --shadow: rgba(15, 44, 22, 0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 1.4 system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--te);
      margin: 0;
      padding: 12px;
      padding-bottom: 90px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 12px var(--shadow);
    }
    h1 { font-size: 1.25rem; margin: 0; color: var(--ac); }
    .card {
      background: var(--card);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 12px var(--shadow);
    }
    .btn {
      background: var(--ac);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Keuangan Pribadi</h1>
  </header>
  
  <div class="card">
    <h3>Catat Transaksi</h3>
    <label>Keterangan</label>
    <input type="text" id="desc" placeholder="Contoh: Gaji, Belanja...">
    <label>Jumlah (Rp)</label>
    <input type="number" id="amount" placeholder="0">
    <button class="btn" onclick="saveData()">Simpan</button>
  </div>

  <div class="card">
    <h3>Riwayat Keuangan</h3>
    <div id="historyList">Belum ada transaksi.</div>
  </div>

  <script>
    function saveData() {
      const desc = document.getElementById('desc').value;
      const amount = document.getElementById('amount').value;
      if(!desc || !amount) {
        alert('Mohon isi semua data!');
        return;
      }
      const list = document.getElementById('historyList');
      if(list.innerText === 'Belum ada transaksi.') list.innerHTML = '';
      list.innerHTML += `<div style="padding: 8px 0; border-bottom: 1px solid #eee;"><b>${desc}</b>: Rp ${Number(amount).toLocaleString('id-ID')}</div>`;
      document.getElementById('desc').value = '';
      document.getElementById('amount').value = '';
    }

    // Registrasi Service Worker untuk Mode Offline PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('ServiceWorker registered!', reg))
          .catch(err => console.log('ServiceWorker registration failed:', err));
      });
    }
  </script>
</body>
</html>
